services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: autoapply
      POSTGRES_USER: autoapply
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autoapply -d autoapply"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    # Requires the NVIDIA runtime. Remove this line to run on the CPU, which is much slower.
    gpus: all
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Downloads the model once (about 4.7 GB), then exits.
  model-download:
    image: ollama/ollama:latest
    command: ["pull", "${SLM_MODEL:-qwen2.5:7b}"]
    environment:
      OLLAMA_HOST: ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      BOSS_KEY: ${BOSS_KEY:?Set BOSS_KEY in .env}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      POSTGRES_HOST: db
      POSTGRES_DB: autoapply
      POSTGRES_USER: autoapply
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SLM_BASE_URL: http://ollama:11434
      SLM_MODEL: ${SLM_MODEL:-qwen2.5:7b}
      TAILOR_RESUME: ${TAILOR_RESUME:-true}
      AUTO_CLICK_SUBMIT: ${AUTO_CLICK_SUBMIT:-false}
    volumes:
      - resumes:/app/DB
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy

  # The only published port: serves the console and proxies the API and sockets.
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      - backend

volumes:
  db-data:
  ollama-models:
  resumes:
